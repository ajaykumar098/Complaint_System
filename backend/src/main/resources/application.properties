spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_system}
spring.datasource.username=${DB_USERNAME:complaint_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=uploads
app.admin.username=${ADMIN_USERNAME:}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
